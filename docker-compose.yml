version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: kifan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kifan
      POSTGRES_USER: kifan
      POSTGRES_PASSWORD: kifan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
